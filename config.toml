baseURL = "https://www.rudylee.com/blog"
languageCode = "en-us"
theme = "hyde"
publishDir = "docs"
canonifyURLs = true

[services.disqus]
  shortname = "blogrudylee"

[params]
  author = "Rudy Lee"
  description = "Hi! I'm Rudy Lee. Here are some thoughts of mine."
  copyright = "Rudy Lee"

[params.social]
	twitter = "rudylee88"
	github = "rudylee"
	linkedin = "rudy-lee-12952b20"
  gravatar = "rudylee1988@gmail.com"

# Posts are written in the Obsidian vault, not in content/posts.
# The vault's blog/ folder becomes the "posts" section, and its attachments/
# folder is served at /attachments/ (see layouts/_default/_markup/render-image.html).
[markup]
  [markup.goldmark.renderer]
    unsafe = true   # old posts contain raw HTML; Hugo < 0.60 rendered it
  [markup.highlight]
    codeFences = true
    lineNos = true
    lineNumbersInTable = true

[module]
  [[module.mounts]]
    source = "/Users/rudy/Documents/Rudy/blog"
    target = "content/posts"
    excludeFiles = ["attachments/**"]
  [[module.mounts]]
    source = "/Users/rudy/Documents/Rudy/blog/attachments"
    target = "static/attachments"
  [[module.mounts]]
    source = "static"
    target = "static"

[permalinks]
  posts = "/:slug/"

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 100
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 200
  [[menu.main]]
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
    weight = 300
